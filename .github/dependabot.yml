# Weekly update pull requests, one per ecosystem for minor and patch updates;
# major updates get their own. The cooldown skips releases younger than a day.
version: 2
updates:
  # The daemon. Cargo.lock is committed, so a bump arrives as a lockfile change
  # that the build workflow compiles and tests before anyone merges it.
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      cargo:
        update-types: [minor, patch]

  # The status page. Its lockfile is pnpm lockfileVersion 9, which Dependabot
  # reads through the npm ecosystem.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      npm:
        update-types: [minor, patch]

  # The firmware is absent on purpose. Its one dependency, espressif/mdns, comes
  # from the ESP-IDF component registry at components.espressif.com, and
  # Dependabot has no ecosystem for it. update-firmware-components.yaml covers it
  # instead, by asking the component manager itself to re-solve the lock.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      github-actions:
        update-types: [minor, patch]
