name: Release

# Manual, and it publishes artifacts that were built earlier rather than building
# its own. That is deliberate: the version is baked into the .deb and into the
# firmware's app descriptor, so the only way for the release tag and the contents
# to agree is to ship the exact artifacts a build produced at that version.
#
# Consequently this releases the CURRENT VERSION and bumps afterwards. The
# increment chooses the version the next cycle starts from, not the one being
# released, and the bump arrives as a pull request rather than a push to master.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run ID to take the artifacts from
        required: true
        type: string
      increment:
        description: How to bump VERSION for the next cycle
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  release:
    name: Release
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@v7

      - name: Resolve the version being released
        id: released
        run: |
          ./scripts/version check
          echo "version=$(./scripts/version current)" >> "$GITHUB_OUTPUT"

      # The .deb's version alone proves little: VERSION only moves at release time,
      # so every build since the last release carries the same version, including
      # runs of unmerged and forked pull requests, whose artifacts are stored in
      # this repository too. Only a successful Build of exactly the commit being
      # tagged is accepted.
      - name: Check the run built this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r workflow sha conclusion repo < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '[.path, .head_sha, .conclusion, .head_repository.full_name] | @tsv')
          problems=()
          case "$workflow" in
            .github/workflows/build.yaml | .github/workflows/build.yaml@*) ;;
            *) problems+=("it is a run of '$workflow', not of the Build workflow") ;;
          esac
          [ "$repo" = "$GITHUB_REPOSITORY" ] || problems+=("it built '$repo', not $GITHUB_REPOSITORY")
          [ "$sha" = "$GITHUB_SHA" ] || problems+=("it built $sha, but this release tags $GITHUB_SHA")
          [ "$conclusion" = success ] || problems+=("it concluded '$conclusion', not success")
          if [ ${#problems[@]} -gt 0 ]; then
            for problem in "${problems[@]}"; do echo "::error::run $RUN_ID: $problem"; done
            exit 1
          fi
          echo "run $RUN_ID is a successful Build of $GITHUB_SHA"

      - name: Download every artifact from run ${{ inputs.run_id }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      # A run ID is easy to mistype and VERSION moves between builds, so prove the
      # artifacts really were built at the version about to be tagged instead of
      # trusting the operator's paste.
      - name: Check the artifacts were built from this version
        env:
          VERSION: ${{ steps.released.outputs.version }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          deb=$(find artifacts -name 'fan-controllerd_*.deb' -print -quit)
          if [ -z "$deb" ]; then
            echo "::error::run $RUN_ID has no .deb among its artifacts"
            exit 1
          fi
          got=$(dpkg-deb -f "$deb" Version)
          want="${VERSION}"
          if [ "$got" != "$want" ]; then
            echo "::error::$deb declares version $got but VERSION says $want." \
                 "Either run_id points at a different version, or VERSION moved since that build."
            exit 1
          fi
          for required in \
              "artifacts/status-page-${VERSION}/index.html.gz" \
              "artifacts/firmware-${VERSION}-esp32c3/fan-controller.bin"; do
            if [ ! -f "$required" ]; then
              echo "::error::run $RUN_ID is missing $required"
              exit 1
            fi
          done
          echo "all three artifacts present, built from $VERSION"

      - name: Assemble the release files
        env:
          VERSION: ${{ steps.released.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name 'fan-controllerd_*.deb' -exec cp -t release {} +
          cp "artifacts/status-page-${VERSION}/index.html.gz" \
             "release/fan-controller-status-page-${VERSION}.html.gz"
          ( cd "artifacts/firmware-${VERSION}-esp32c3" && zip -q -r - . ) \
             > "release/fan-controller-firmware-${VERSION}-esp32c3.zip"
          ls -l release

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.released.outputs.version }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Artifacts from build run $RUN_ID, published unmodified.

          The Debian package targets Debian trixie on aarch64. It installs the
          service disabled, because the shipped /etc/fan-controllerd.toml names a
          placeholder device and disk; edit it, then enable the service.

          The firmware archive holds the bootloader, the partition table and the
          app image. WiFi is not configured in it: CI builds without
          sdkconfig.secrets, so the status page and mDNS stay off until you
          rebuild with your own credentials. USB control works as shipped.

          The status page is the same one already embedded in that firmware, and
          is published separately only for inspection.
          EOF
          )
          gh release create "v${VERSION}" release/* \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "$notes"

      - name: Bump VERSION for the next cycle
        id: bump
        run: echo "version=$(./scripts/version bump ${{ inputs.increment }})" >> "$GITHUB_OUTPUT"

      - name: Open the version-bump pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # Without this the action stages everything it finds, and the working
          # tree still holds the downloaded artifacts/ and the assembled release/.
          # Name the files the bump actually touches instead.
          add-paths: |
            VERSION
            daemon/Cargo.toml
            daemon/Cargo.lock
            daemon/doc/fan-controllerd.8
            frontend/package.json
            daemon/targets/debian/changelog
          branch: chore/bump-version-to-${{ steps.bump.outputs.version }}
          delete-branch: true
          title: Bump VERSION to ${{ steps.bump.outputs.version }}
          commit-message: |
            Bump VERSION to ${{ steps.bump.outputs.version }}

            v${{ steps.released.outputs.version }} is released, so master moves on
            to the next ${{ inputs.increment }} version. Generated by the release
            workflow.
          body: |
            `v${{ steps.released.outputs.version }}` is released. This moves
            `VERSION` on to `${{ steps.bump.outputs.version }}` (a
            `${{ inputs.increment }}` increment) and brings the component
            literals along with it:

            - `daemon/Cargo.toml` and `daemon/Cargo.lock`
            - `daemon/doc/fan-controllerd.8` (version and date)
            - `frontend/package.json`
            - `daemon/targets/debian/changelog` (a new entry, prepended)

            The firmware needs no edit; it reads `VERSION` when CMake configures.

            Opened by the release workflow for run
            ${{ inputs.run_id }}.
