# A hand-built install: make as yourself, then sudo make install.
#
# Everything the admin built goes under /usr/local, which is what /usr/local is
# for. The three exceptions are not arbitrary: systemd reads units only from
# /etc/systemd/system or /usr/lib/systemd/system, udev and systemd-modules-load
# likewise take local additions from /etc, and the daemon's compiled-in default
# config path is /etc/fan-controllerd.toml. Putting any of them under
# /usr/local/etc would leave them simply unread.
BINDIR=/usr/local/bin
CONFIG_FILE=/etc/fan-controllerd.toml
UNITDIR=/etc/systemd/system
UDEVRULESDIR=/etc/udev/rules.d
MODULESLOADDIR=/etc/modules-load.d
MANDIR=/usr/local/share/man
