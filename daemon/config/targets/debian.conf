# Debian package layout: files the package owns live under /usr, and only the
# admin's configuration lives under /etc, where dpkg tracks it as a conffile and
# will not overwrite local edits. The vendor directories under /usr/lib are the
# ones a package is expected to use, leaving the matching /etc paths free for the
# admin to override.
BINDIR=/usr/bin
CONFIG_FILE=/etc/fan-controllerd.toml
UNITDIR=/usr/lib/systemd/system
UDEVRULESDIR=/usr/lib/udev/rules.d
MODULESLOADDIR=/usr/lib/modules-load.d
MANDIR=/usr/share/man
