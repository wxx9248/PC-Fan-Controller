# Every parameter an installation target may set, with its default value.
#
# This file is the declaration: a target file may only set a name that appears
# here, and a template may only reference one that appears here. Both rules are
# enforced by scripts/render-config, so a typo fails the render rather than
# shipping a broken config.
#
# Sourced as POSIX shell. Quote any value containing spaces. Do not refer to
# other variables: each target states its own values outright, so that adding a
# distribution is a matter of copying one file and editing paths.

# ---- Install layout. Deliberately empty: each target states its own, and a
# ---- target that forgets one fails the render. Not overridable with --set.
BINDIR=
CONFIG_FILE=
UNITDIR=
UDEVRULESDIR=
MODULESLOADDIR=
MANDIR=

# ---- systemd unit ----
SERVICE_DESCRIPTION="PC fan controller daemon (HDD temperature to fan curve)"
DOCUMENTATION_URL=https://github.com/wxx9248/PC-Fan-Controller
RESTART_SEC=5
WATCHDOG_SEC=60

# ---- The controller. Its serial is the chip's factory MAC, and it names both
# ---- the /dev/serial/by-id/ path in the daemon config and the udev match, so
# ---- it is set once: make CONTROLLER_SERIAL=AA:BB:CC:DD:EE:FF ...
USB_VENDOR_ID=303a
USB_PRODUCT_ID=1001
CONTROLLER_SERIAL=XX:XX:XX:XX:XX:XX
DEVICE_SYMLINK=fan-controller

# ---- The only temperature source the daemon has. ----
KERNEL_MODULE=drivetemp

# ---- Daemon configuration. DISKS is a placeholder to replace per machine, the
# ---- same way as CONTROLLER_SERIAL; the tuning values are measurements from one
# ---- particular fan and array, kept here so a target can ship its own.
DISKS='["ata-MODEL_SERIAL"]'
POLL_INTERVAL_S=10
CONTROLLER_FAILSAFE_TIMEOUT_S=30
CURVE='[[38,31],[41,45],[44,60],[47,80],[50,100]]'
FAN_FLOOR_DUTY_PERCENT=31
SMOOTHING_ALPHA=0.3
DEADBAND_PERCENT=2
MIN_EXPECTED_RPM=400
STALL_CYCLES=3
EXPECTED_RPM='[[0,840],[31,840],[32,900],[50,1185],[100,1973]]'
STALL_TOLERANCE_PERCENT=70
